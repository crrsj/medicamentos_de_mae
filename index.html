<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Medicamentos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-indigo-600 text-white shadow-md py-6 px-4 sm:px-8">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm">
                    <i class="fa-solid fa-capsules text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Controle de Medicamentos</h1>
                    <p class="text-indigo-200 text-sm">Painel de Monitoramento Diário</p>
                </div>
            </div>
            <!-- Relógio em Tempo Real -->
            <div class="bg-indigo-700/60 border border-indigo-500/50 px-4 py-2 rounded-lg text-xs sm:text-sm flex items-center space-x-2 backdrop-blur-sm shadow-inner">
                <i class="fa-regular fa-clock text-indigo-300"></i>
                <span class="text-indigo-200">Agora:</span>
                <span id="relogio-tempo-real" class="font-semibold text-white">Carregando...</span>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-8 py-8 flex-grow">
        
        <!-- Cards de Resumo (Dashboard) -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total de Medicamentos</p>
                    <h3 id="card-total" class="text-3xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600">
                    <i class="fa-solid fa-boxes-stacked text-xl"></i>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-amber-600">Alerta Amarelo (&lt; 15 un)</p>
                    <h3 id="card-amarelo" class="text-3xl font-bold text-amber-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-amber-50 flex items-center justify-center text-amber-500">
                    <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-rose-600">Alerta Vermelho (&lt; 10 un)</p>
                    <h3 id="card-vermelho" class="text-3xl font-bold text-rose-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-rose-50 flex items-center justify-center text-rose-500">
                    <i class="fa-solid fa-circle-exclamation text-xl"></i>
                </div>
            </div>
        </div>

        <!-- Seção da Tabela -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800"> Medicamentos e Estoque</h2>                  
                <!-- Barra de Pesquisa -->
                <div class="w-full sm:w-72 relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-sm"></i>
                    </span>
                    <input type="text" id="input-busca" onkeyup="filtrarMedicamentos()" placeholder="Buscar por paciente ou remédio..." 
                        class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/70 border-b border-slate-200 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                            <th class="px-6 py-4">Paciente</th>
                            <th class="px-6 py-4">Medicamento</th>
                            <th class="px-6 py-4">Quantidade</th>
                            <th class="px-6 py-4">Atualização (JSON)</th>
                            <th class="px-6 py-4">Descrição / Observações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-medicamentos" class="divide-y divide-slate-100 text-sm">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="bg-white border-t border-slate-200 mt-12 py-6 text-center text-sm text-slate-500">
        <p>Controle de Medicamentos &copy;</p>
    </footer>

    <!-- Script de Carga e Renderização -->
    <script>
        let dadosGlobais = [];

        // 1. Relógio em tempo real no cabeçalho
        function iniciarRelogio() {
            function atualizar() {
                const agora = new Date();
                const formatoDataHora = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR');
                const elemento = document.getElementById('relogio-tempo-real');
                if (elemento) {
                    elemento.textContent = formatoDataHora;
                }
            }
            atualizar();
            setInterval(atualizar, 1000);
        }

        // 2. Carregar dados do arquivo dados.json
        async function carregarDados() {
            try {
                const resposta = await fetch('./dados.json');
                if (!resposta.ok) throw new Error('Erro ao carregar arquivo dados.json');
                dadosGlobais = await resposta.json();
                renderizarDashboard(dadosGlobais);
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('tabela-medicamentos').innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-rose-500 font-medium">
                            <i class="fa-solid fa-triangle-exclamation mr-2"></i> Não foi possível ler o arquivo <strong>dados.json</strong>. Certifique-se de iniciar o Live Server na pasta correta.
                        </td>
                    </tr>
                `;
            }
        }

        // 3. Renderizar tabela, flags e contadores
        function renderizarDashboard(dados) {
            const tbody = document.getElementById('tabela-medicamentos');
            tbody.innerHTML = '';

            let total = dados.length;
            let amarelo = 0;
            let vermelho = 0;

            dados.forEach(item => {
                let badgeHTML = '';

                if (item.quantidade < 10) {
                    vermelho++;
                    badgeHTML = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-rose-50 text-rose-700 border border-rose-200">
                                    <span class="w-1.5 h-1.5 mr-1.5 bg-rose-500 rounded-full animate-pulse"></span> Vermelho (${item.quantidade})
                                 </span>`;
                } else if (item.quantidade < 15) {
                    amarelo++;
                    badgeHTML = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">
                                    <span class="w-1.5 h-1.5 mr-1.5 bg-amber-500 rounded-full"></span> Amarelo (${item.quantidade})
                                 </span>`;
                } else {
                    badgeHTML = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                                    <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-500 rounded-full"></span> Normal (${item.quantidade})
                                 </span>`;
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors border-b border-slate-100 last:border-none";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-slate-800">${item.paciente}</td>
                    <td class="px-6 py-4 text-slate-600">${item.medicamento}</td>
                    <td class="px-6 py-4">${badgeHTML}</td>
                    <td class="px-6 py-4 text-slate-500 text-xs">
                        <i class="fa-regular fa-calendar-days text-slate-400 mr-1"></i> ${item.dataAtualizacao}
                    </td>
                    <td class="px-6 py-4 text-slate-600 text-sm">${item.descricao}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('card-total').textContent = total;
            document.getElementById('card-amarelo').textContent = amarelo;
            document.getElementById('card-vermelho').textContent = vermelho;
        }

        // 4. Busca interativa
        function filtrarMedicamentos() {
            const termo = document.getElementById('input-busca').value.toLowerCase();
            const dadosFiltrados = dadosGlobais.filter(item => 
                item.paciente.toLowerCase().includes(termo) || 
                item.medicamento.toLowerCase().includes(termo)
            );
            renderizarDashboard(dadosFiltrados);
        }

        // Inicialização correta ao carregar a página
        window.onload = function() {
            iniciarRelogio();
            carregarDados();
        };
    </script>
</body>
</html>
